static_resources:
  listeners:
    - name: vellum_api
      per_connection_buffer_limit_bytes: 32768
      address:
        socket_address:
          address: 0.0.0.0
          port_value: ${PORT}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                use_remote_address: true
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% [%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%\" %RESPONSE_CODE%\n"
                route_config:
                  name: vellum_routes
                  virtual_hosts:
                    - name: vellum_api
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                regex: ".*"
                          allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD"
                          allow_headers: "apikey,authorization,content-type,x-client-info"
                          expose_headers: "content-length,content-range"
                          max_age: "3600"
                      request_headers_to_add:
                        - header:
                            key: X-Forwarded-Host
                            value: "%REQ(:AUTHORITY)%"
                          append_action: ADD_IF_ABSENT
                      routes:
                        - match:
                            path: /health
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ok\n"
                        - match:
                            prefix: /auth/v1/verify
                          route:
                            cluster: auth
                            prefix_rewrite: /verify
                            timeout: 30s
                        - match:
                            prefix: /auth/v1/callback
                          route:
                            cluster: auth
                            prefix_rewrite: /callback
                            timeout: 30s
                        - match:
                            prefix: /auth/v1/
                          route:
                            cluster: auth
                            prefix_rewrite: /
                            timeout: 30s
                        - match:
                            prefix: /rest/v1/
                          route:
                            cluster: rest
                            prefix_rewrite: /
                            timeout: 60s
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          public_endpoints:
                            permissions:
                              - url_path:
                                  path:
                                    exact: /health
                              - url_path:
                                  path:
                                    prefix: /auth/v1/verify
                              - url_path:
                                  path:
                                    prefix: /auth/v1/callback
                            principals:
                              - any: true
                          cors_preflight:
                            permissions:
                              - and_rules:
                                  rules:
                                    - header:
                                        name: ":method"
                                        string_match:
                                          exact: OPTIONS
                                    - or_rules:
                                        rules:
                                          - url_path:
                                              path:
                                                prefix: /auth/v1/
                                          - url_path:
                                              path:
                                                prefix: /rest/v1/
                            principals:
                              - any: true
                          client_api_key:
                            permissions:
                              - url_path:
                                  path:
                                    prefix: /auth/v1/
                              - url_path:
                                  path:
                                    prefix: /rest/v1/
                            principals:
                              - header:
                                  name: apikey
                                  string_match:
                                    exact: "${ANON_KEY}"
                              - header:
                                  name: apikey
                                  string_match:
                                    exact: "${SERVICE_ROLE_KEY}"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: auth
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${AUTH_HOST}
                      port_value: ${AUTH_PORT}
    - name: rest
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: rest
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${REST_HOST}
                      port_value: ${REST_PORT}

overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 1000

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
